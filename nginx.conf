server {
    listen 3000;
    root /usr/share/nginx/html;
    
    location /previews/ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header CDN-Cache-Control "no-store";
    }
    
    # Persistent host catalog is maintained by setlist-planned.timer.
    location = /bands.json {
        root /data/catalog;
        try_files /bands.json @seed_catalog;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header CDN-Cache-Control "no-store";
    }
    
    location @seed_catalog {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
